services:
  ingest:
    build: .
    command: python scripts/ingest.py
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data

  api:
    build: .
    command: uvicorn src.api:app --host 0.0.0.0 --port 8000
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 8000
      RUN_INGEST_ON_START: "0"
      ENABLE_MLFLOW: "1"
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_EXPERIMENT_NAME: hr-agent
      # HR handoff email (Component 14 follow-on) -- secrets (MAILTRAP_API_TOKEN,
      # MAILTRAP_INBOX_ID) come from .env via env_file above; these just pass
      # the non-secret settings through with the same EMAIL_DRY_RUN=true-by-
      # default safety net as a bare-metal run. Real sends go to a Mailtrap
      # Sandbox inbox, not a production mailbox (proof-of-concept project).
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-mailtrap}
      EMAIL_DRY_RUN: ${EMAIL_DRY_RUN:-true}
      HR_EMAIL_TO: ${HR_EMAIL_TO:-hrmo@faculty-concierge.test}
      HR_EMAIL_FROM: ${HR_EMAIL_FROM:-onboarding@faculty-concierge.test}
      EMAIL_ATTACH_ORIGINALS: ${EMAIL_ATTACH_ORIGINALS:-false}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      ingest:
        condition: service_completed_successfully
      mlflow:
        condition: service_started

  ui:
    build: .
    command: streamlit run src/ui.py --server.address 0.0.0.0 --server.port 7860 --server.headless true
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 7860
      API_URL: http://api:8000
    ports:
      - "7860:7860"
    depends_on:
      - api

  mlflow:
    build: .
    command: mlflow server --host 0.0.0.0 --port 5000 --workers 1 --backend-store-uri sqlite:////app/data/mlflow.db --allowed-hosts "mlflow:*,localhost:*,localhost,127.0.0.1:*"
    environment:
      PORT: 5000
      MLFLOW_BACKEND_STORE_URI: sqlite:////app/data/mlflow.db
      MLFLOW_ALLOWED_HOSTS: "mlflow:*,localhost:*,localhost,127.0.0.1:*"
    expose:
      - "5000"
    volumes:
      - ./data:/app/data
